version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking-backend
    ports:
      - "8000:8000"
    environment:
      # -------------------------------------------------------
      # Node 1: Intent Classification Service (chạy trên Colab)
      # Sau khi chạy notebook Intent-Service-Colab.ipynb,
      # copy URL ngrok/Pinggy vào đây:
      INTENT_SERVICE_URL: https://REPLACE_WITH_INTENT_COLAB_URL
      INTENT_MODEL_NAME: ngbaoan/intent-banking

      # -------------------------------------------------------
      # Node 4: Ollama LLM (chạy trên Colab)
      # Sau khi chạy notebook Ollama-Pinggy.ipynb,
      # copy URL Pinggy vào đây:
      OLLAMA_BASE_URL: https://REPLACE_WITH_OLLAMA_COLAB_URL
      OLLAMA_MODEL: gpt-oss:20b
    networks:
      - public_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: banking-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - public_net

networks:
  public_net:
    name: banking_public_net
